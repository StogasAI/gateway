name: Build the pinned Linux verifier
description: Build the static C archive used by the gateway Go dependency.
outputs:
  cgo-ldflags:
    description: CGO_LDFLAGS for the steps that build the gateway.
    value: ${{ steps.build.outputs.cgo-ldflags }}
runs:
  using: composite
  steps:
    - name: Build the static archive
      id: build
      shell: bash
      run: |
        native="$(stogas/scripts/verifier-native.sh)"
        echo "cgo-ldflags=-L$native" >> "$GITHUB_OUTPUT"
