name: Build the pinned Linux verifier
description: Build the static C archive used by the gateway Go dependency.
runs:
  using: composite
  steps:
    - name: Resolve the verifier revision
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        commit=$(jq -r '.releaseSources.stogasVerifier.commit' stogas/release/pins.lock.json)
        version=$(cd transports && GOWORK=off go list -m -f '{{.Version}}' github.com/StogasAI/verifier/go)
        [[ "$version" == *-"${commit:0:12}" ]]
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: StogasAI/verifier
        ref: ${{ steps.pin.outputs.commit }}
        path: .ci/stogas-verifier
        persist-credentials: false
    - name: Build the static archive
      shell: bash
      working-directory: .ci/stogas-verifier
      run: |
        set -euo pipefail
        rustup show active-toolchain
        cargo build --locked --package stogas-verifier-ffi --no-default-features --features staging,gateway
        mkdir -p "$RUNNER_TEMP/stogas-verifier-native"
        cp target/debug/libstogas_verifier_ffi.a "$RUNNER_TEMP/stogas-verifier-native/"
        echo "CGO_LDFLAGS=-L$RUNNER_TEMP/stogas-verifier-native" >> "$GITHUB_ENV"
