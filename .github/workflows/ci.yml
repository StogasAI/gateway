name: Gateway Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: |
            core/go.sum
            transports/go.sum
      - uses: ./.github/actions/setup-verifier
      - name: Test Stogas packages with race detection
        working-directory: transports
        run: GOWORK=off go test -tags=stogas_gateway -race -shuffle=on -count=1 ./...
      - name: Test deterministic retained core packages
        working-directory: core
        run: GOWORK=off go test -shuffle=on -count=1 . ./internal/llmtests ./internal/memtest ./keyselectors ./mcp/... ./network ./providers/... ./schemas
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm
      - name: Test the shared WebAssembly policy compiler
        run: |
          npm ci --ignore-scripts
          npm run test:policy
