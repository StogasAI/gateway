name: CI

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a ref cancels the run before it. A release runs these jobs
# itself, so no release waits for a run that a push can cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tests that time their own work run alone after the others and without the race detector,
    # which makes CPU-bound code about ten times slower. An Azure discovery at its limits must
    # finish within the gateway's own deadline, settlement calls start a settlement interval apart
    # unless a full call waits, and upstream core tests tell an immediate end from a wait by
    # elapsed time.
    env:
      TIMING_TESTS: '^(TestAzureDiscoveryAtItsLimits|TestSettlementBatchesRequestsThatFinishDuringACall)$'
      CORE_TIMING_TESTS: '^(TestAzureListModelsSpeechVoicesTiming|TestChatStreamWaitForUsageAcceptsUsageOnTheFinishFrame|TestChatStreamWaitForUsageTerminatesOnUsageFrameNotIdleTimeout|TestTextCompletionStreamWaitForUsageTerminatesOnUsageFrameNotIdleTimeout)$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: |
            core/go.sum
            transports/go.sum
      - id: verifier
        uses: $/.github/actions/setup-verifier
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: stogas/pdftext
      # The gateway starts this program for each PDF that it reads, and the tests start it too.
      # Link-time optimization behaves the same and costs minutes on every run, so only the
      # reproducible release build applies it.
      - name: Build and test the PDF reader
        working-directory: stogas/pdftext
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          cmp Cargo.lock ../release/locks/pdftext.Cargo.lock
          cargo test --quiet --locked --release
          echo "STOGAS_PDFTEXT=$PWD/target/release/stogas-pdftext" >> "$GITHUB_ENV"
      - name: Test Stogas packages with race detection
        working-directory: transports
        env:
          CGO_LDFLAGS: ${{ steps.verifier.outputs.cgo-ldflags }}
        run: GOWORK=off go test -tags=stogas_gateway -race -shuffle=on -count=1 -skip "$TIMING_TESTS" -coverprofile="$RUNNER_TEMP/transports.cover" ./...
      # The race detector changes allocation; stop-the-world collection exposes short heap peaks.
      - name: Measure request preparation memory
        working-directory: transports
        env:
          CGO_LDFLAGS: ${{ steps.verifier.outputs.cgo-ldflags }}
        run: GOWORK=off GODEBUG=gcstoptheworld=1 go test -tags=stogas_gateway -count=1 -run '^TestRequestPreparationFitsItsMemoryCharges$' ./stogas-http
      - name: Test deterministic retained core packages
        working-directory: core
        run: GOWORK=off go test -shuffle=on -count=1 -skip "$CORE_TIMING_TESTS" -coverprofile="$RUNNER_TEMP/core.cover" . ./internal/llmtests ./internal/memtest ./keyselectors ./mcp/... ./network ./providers/... ./schemas
      - name: Run Stogas timing tests alone
        working-directory: transports
        env:
          CGO_LDFLAGS: ${{ steps.verifier.outputs.cgo-ldflags }}
        run: GOWORK=off go test -tags=stogas_gateway -p 1 -shuffle=on -count=1 -run "$TIMING_TESTS" ./stogas ./stogas/billing
      - name: Run core timing tests alone
        working-directory: core
        run: GOWORK=off go test -p 1 -shuffle=on -count=1 -run "$CORE_TIMING_TESTS" ./providers/azure ./providers/openai
      # Coverage shows which statements the tests run, not what they check, so it gates nothing.
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: |
          {
            echo '| Module | Statements that the tests run |'
            echo '| --- | --- |'
            for module in transports core; do
              if [ -f "$RUNNER_TEMP/$module.cover" ]; then
                total=$(cd "$module" && GOWORK=off go tool cover -func="$RUNNER_TEMP/$module.cover" | awk 'END { print $NF }')
                echo "| $module | $total |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Test the shared WebAssembly policy compiler
        run: |
          npm ci --ignore-scripts
          npm run test:policy

  dependencies:
    name: Dependencies and Release Inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: |
            core/go.sum
            transports/go.sum
      - name: Verify release pins
        run: node stogas/release/scripts/verify-pins.mjs
      - name: Test release scripts
        run: node --test stogas/release/scripts/*.test.mjs
      - name: Verify Go modules
        working-directory: transports
        run: |
          go mod verify
          go mod tidy -diff
      # A release needs a passing run, so none ships with a known vulnerability that it calls.
      - name: Run Go vulnerability scan
        working-directory: transports
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags=stogas_gateway ./...
