name: Gateway IGVM Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: gateway-igvm-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build IGVM Release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Verify checked-out tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)"

      - name: Verify release pins
        run: node stogas/release/scripts/verify-pins.mjs

      - name: Restore Stogas release vendor cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: stogas/release/vendor
          key: stogas-release-vendor-${{ runner.os }}-${{ hashFiles('transports/go.mod', 'transports/go.sum', 'core/go.mod', 'core/go.sum', 'stogas/release/locks/*.Cargo.lock', 'stogas/release/patches/*.patch', 'stogas/release/pins.lock.json', 'stogas/release/guix/channels.scm') }}

      - name: Restore Guix channel checkout cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/guix/checkouts
          key: stogas-release-guix-channel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stogas/release/guix/channels.scm', 'stogas/release/pins.lock.json') }}

      - name: Install pinned Guix bootstrap
        run: stogas/release/scripts/install-guix-bootstrap.sh

      - name: Build IGVM in pinned Guix environment
        run: stogas/release/scripts/build-release.sh "$GITHUB_REF_NAME" "dist/gateway/$GITHUB_REF_NAME"

      - name: Generate GitHub artifact attestation
        id: attest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4
        with:
          subject-path: dist/gateway/${{ github.ref_name }}/release-manifest.json

      - name: Collect official GitHub attestation evidence
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/gateway/${{ github.ref_name }}/github-attestation.jsonl"

      - name: Prepare release payload
        run: |
          set -euo pipefail
          cd "dist/gateway/$GITHUB_REF_NAME"
          rm \
            gateway.init \
            gateway.kernel \
            gateway.initramfs.cpio.zst \
            kernel-config.txt

      - name: Verify release payload file set
        run: |
          set -euo pipefail
          cd "dist/gateway/$GITHUB_REF_NAME"
          expected_files=(
            LICENSE
            NOTICE
            gateway.igvm
            release-manifest.json
            snp-launch-policies.json
            github-attestation.jsonl
          )
          actual_files="$(find . -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)"
          expected_file_list="$(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort)"
          if [ "$actual_files" != "$expected_file_list" ]; then
            echo "release payload contains unexpected files" >&2
            printf 'expected files:\n%s\nactual files:\n%s\n' "$expected_file_list" "$actual_files" >&2
            exit 70
          fi
          for file in "${expected_files[@]}"; do
            test -f "$file" && test ! -L "$file" || {
              echo "release payload entry is not a regular file: $file" >&2
              exit 70
            }
          done

      - name: Upload release payload for publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-release-${{ github.ref_name }}
          path: dist/gateway/${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Draft Release
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Verify checked-out tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)"

      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gateway-release-${{ github.ref_name }}
          path: dist/gateway/${{ github.ref_name }}

      - name: Verify downloaded release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_dir="dist/gateway/$tag"
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          gh attestation verify "$release_dir/release-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$release_dir/github-attestation.jsonl" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/gateway-igvm-release.yml@refs/tags/$tag" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --source-ref "refs/tags/$tag" \
            --source-digest "$commit" \
            --deny-self-hosted-runners
          node --input-type=module - \
            "$release_dir/release-manifest.json" \
            "$release_dir/gateway.igvm" \
            "$tag" \
            "$commit" \
            "$tree" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync } from 'node:fs';

          const [manifestPath, igvmPath, tag, commit, tree] = process.argv.slice(2);
          const manifestBytes = readFileSync(manifestPath);
          const manifest = JSON.parse(manifestBytes);
          const canonical = (value) => {
            if (value === null || typeof value !== 'object') return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(canonical).join(',')}]`;
            return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}`;
          };
          const igvm = {
            sha256: createHash('sha256').update(readFileSync(igvmPath)).digest('hex'),
            sizeBytes: statSync(igvmPath).size
          };
          if (
            manifestBytes.toString('utf8') !== `${canonical(manifest)}\n` ||
            manifest.schema !== 'stogas.gateway.release.v1' ||
            manifest.git?.repository !== `https://github.com/${process.env.GITHUB_REPOSITORY}` ||
            manifest.git?.tag !== tag ||
            manifest.git?.ref !== `refs/tags/${tag}` ||
            manifest.git?.commit !== commit ||
            manifest.git?.tree !== tree ||
            manifest.artifacts?.['gateway.igvm']?.sha256 !== igvm.sha256 ||
            manifest.artifacts?.['gateway.igvm']?.sizeBytes !== igvm.sizeBytes
          ) {
            throw new Error('Downloaded release payload does not match its attested manifest.');
          }
          NODE

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_commit="$(git rev-parse HEAD)"
          test "$(git rev-list -n1 "$tag")" = "$release_commit"
          ASSETS=(
            "dist/gateway/$tag/LICENSE"
            "dist/gateway/$tag/NOTICE"
            "dist/gateway/$tag/gateway.igvm"
            "dist/gateway/$tag/release-manifest.json"
            "dist/gateway/$tag/snp-launch-policies.json"
            "dist/gateway/$tag/github-attestation.jsonl"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true" || {
              echo "Gateway release $tag is final and cannot be changed." >&2
              exit 1
            }
            gh release view "$tag" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                gh release delete-asset "$tag" "$asset" --yes
              done
            gh release upload "$tag" "${ASSETS[@]}" --clobber
            gh release edit "$tag" --draft=true --target "$release_commit"
          else
            gh release create "$tag" "${ASSETS[@]}" --draft --verify-tag --target "$release_commit" --title "Gateway $tag"
          fi
