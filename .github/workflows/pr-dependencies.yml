name: Dependency Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: |
            core/go.sum
            transports/go.sum
      - name: Verify release pins
        run: node stogas/release/scripts/verify-pins.mjs
      - name: Test release scripts
        run: node --test stogas/release/scripts/*.test.mjs
      - name: Verify Go modules
        working-directory: transports
        run: |
          go mod verify
          go mod tidy -diff
      - name: Run Go vulnerability scan
        working-directory: transports
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags=stogas_gateway ./...
