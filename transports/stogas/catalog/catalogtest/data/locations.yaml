# The places that data handling names. Each place but world lists the places that directly
# contain it, and lies in every place that contains those. A country lists its smallest
# regions; a subdivision such as US-CA lists its country. A place lies in every place that holds
# all the places directly inside it, as southeast-asia lies in apac.
#
# The catalog lists a place only when a record names it or a place inside it: a data handling
# location, a headquartered country or a provider's account location. The build names any other
# place to remove, so the places that policies and the catalog offer are places that data can be in.
#
# The continents and the regions within them follow the territory containment of Unicode CLDR 48,
# from UN M.49, except that europe holds every eu member, Cyprus included. No standard defines
# apac: it is CLDR Asia and Oceania without the Arab states, Israel, Iran, Cyprus and HM, plus IO.
# CLDR data is under the Unicode License v3 (https://www.unicode.org/license.txt):
# https://github.com/unicode-org/cldr-json/blob/48.0.0/cldr-json/cldr-core/supplemental/territoryContainment.json
locations:
  world:
    name: World
    kind: world
    description: Every place. A deployment in world gives no narrower boundary.
  africa:
    name: Africa
    kind: continent
    parentIds: [world]
  asia:
    name: Asia
    kind: continent
    description: The continent, with the Middle East.
    parentIds: [world]
  europe:
    name: Europe
    kind: continent
    description: The continent, with countries outside the European Union such as Norway, Switzerland and the United Kingdom.
    parentIds: [world]
  north-america:
    name: North America
    kind: continent
    description: The continent, with Central America and the Caribbean.
    parentIds: [world]
  oceania:
    name: Oceania
    kind: continent
    description: Australia, New Zealand and the Pacific islands.
    parentIds: [apac]
  south-america:
    name: South America
    kind: continent
    parentIds: [world]
  apac:
    name: Asia-Pacific
    kind: region
    description: Asia and Oceania without the Arab states, Israel, Iran and Cyprus. No standard defines Asia-Pacific.
    parentIds: [world]
  central-america:
    name: Central America
    kind: region
    description: Mexico and the countries south of it to Panama, as UN M.49 defines the region.
    parentIds: [north-america]
  eu:
    name: European Union
    kind: union
    description: The 27 member states of the European Union.
    parentIds: [europe]
  southeast-asia:
    name: Southeast Asia
    kind: region
    description: Brunei, Cambodia, Indonesia, Laos, Malaysia, Myanmar, the Philippines, Singapore, Thailand, Timor-Leste and Vietnam.
    parentIds: [apac, asia]
