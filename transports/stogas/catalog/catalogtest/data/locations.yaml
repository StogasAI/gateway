# The places that data handling names. A continent, region or union lists every country that it
# covers by its ISO 3166-1 code, or XK for Kosovo, and what holds each place follows from those
# lists: a country lies in each smallest region that lists it, a region in each smallest region that
# lists all of its countries and more, and a subdivision such as US-CA in the country of its code. A
# place that no region holds lies in world.
#
# The catalog lists every country, because a company has its headquarters in one, an account's
# resources lie in one and an access policy names the countries that requests may come from. A
# country that no continent lists, Antarctica, lies in world. Country names are the English names
# of Unicode CLDR 48. A subdivision is listed only while a record names it as a data handling
# location or a provider's account location, and the build names any other to remove.
#
# The continents and the regions within them follow the territory containment of Unicode CLDR 48,
# from UN M.49, except that europe holds every eu member, Cyprus included. They leave out the codes
# that ISO 3166-1 does not assign, such as EA for Ceuta and Melilla, but keep XK, which IP address
# data uses for Kosovo. No standard defines apac: it is CLDR Asia and Oceania without the Arab
# states, Israel, Iran, Cyprus and HM, plus IO.
# CLDR data is under the Unicode License v3 (https://www.unicode.org/license.txt):
# https://github.com/unicode-org/cldr-json/blob/48.0.0/cldr-json/cldr-core/supplemental/territoryContainment.json
