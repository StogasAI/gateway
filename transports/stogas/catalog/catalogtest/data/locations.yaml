# The places that data handling names. Each place but world lists the places that directly
# contain it, and lies in every place that contains those. A country lists its smallest
# regions; a subdivision such as US-CA lists its country. A place lies in every place that holds
# all the places directly inside it, as southeast-asia lies in apac.
#
# The continents and the regions within them follow the territory containment of Unicode CLDR 48,
# from UN M.49, except that europe holds every eu member, Cyprus included. No standard defines
# apac: it is CLDR Asia and Oceania without the Arab states, Israel, Iran, Cyprus and HM, plus IO.
# CLDR data is under the Unicode License v3 (https://www.unicode.org/license.txt):
# https://github.com/unicode-org/cldr-json/blob/48.0.0/cldr-json/cldr-core/supplemental/territoryContainment.json
