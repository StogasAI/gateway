# Bedrock's US inference profile, at AWS's 10 percent premium over the global profile. From a
# US source Region it runs only in US Regions; the gateway uses no other source Region for it.
# AWS keeps prompts and completions for 30 days for abuse detection.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard"), reviewed 2026-10-31:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Regions and retention reviewed 2026-10-31: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-1.html
deployments:
  modelId: claude-fable-5-1
  routeIds: [aws-messages]
  upstream:
    model: us.anthropic.claude-fable-5-1
    hosting: aws
    inferenceGeo: us
  overrides:
    dataHandling:
      processingLocation: US
      storageLocation: US
      retentionDays: 30
  pricing:
    input_tokens:
      per_mill_tokens: '11'
    cached_input_tokens:
      per_mill_tokens: '0.275'
    cache_write_5m_input_tokens:
      per_mill_tokens: '13.75'
    cache_write_1h_input_tokens:
      per_mill_tokens: '22'
    output_tokens:
      per_mill_tokens: '55'
