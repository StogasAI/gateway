# Bedrock's global inference profile, which routes across every Region with capacity. AWS keeps
# prompts and completions for 30 days for abuse detection.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard, Global"), reviewed 2026-10-31:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Retention reviewed 2026-10-31: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-1.html
deployments:
  modelId: claude-fable-5-1
  routeIds: [aws-messages]
  upstream:
    model: global.anthropic.claude-fable-5-1
    hosting: aws
    inferenceGeo: global
  overrides:
    dataHandling:
      storageLocation: world
      retentionDays: 30
  pricing:
    input_tokens:
      per_mill_tokens: '10'
    cached_input_tokens:
      per_mill_tokens: '0.25'
    cache_write_5m_input_tokens:
      per_mill_tokens: '12.5'
    cache_write_1h_input_tokens:
      per_mill_tokens: '20'
    output_tokens:
      per_mill_tokens: '50'
