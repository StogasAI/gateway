# Bedrock's global inference profile, which routes across every Region with capacity.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard, Global"), reviewed 2026-11-03:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Messages API support, limits and retention reviewed 2026-11-03: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-5-5.html
deployments:
  modelId: claude-haiku-5-5
  routeIds: [aws-messages]
  upstream:
    model: global.anthropic.claude-haiku-5-5
    hosting: aws
    inferenceGeo: global
  pricing:
    input_tokens:
      per_mill_tokens: '0.1'
      per_mill_context_gt_100k: '0.5'
    cached_input_tokens:
      per_mill_tokens: '0.01'
      per_mill_context_gt_100k: '0.05'
    cache_write_5m_input_tokens:
      per_mill_tokens: '0.125'
      per_mill_context_gt_100k: '0.625'
    cache_write_1h_input_tokens:
      per_mill_tokens: '0.2'
      per_mill_context_gt_100k: '1'
    output_tokens:
      per_mill_tokens: '0.5'
      per_mill_context_gt_100k: '2.5'
