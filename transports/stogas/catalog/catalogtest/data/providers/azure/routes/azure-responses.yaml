routes:
  providerId: azure
  interfaces: [responses]
  inputModalities: [text, image]
  capabilities:
    streaming: true
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: true
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
    toolChoiceNone: true
    toolResultImages: true
    toolResultDocuments: true
  sampling:
    temperature: true
    topP: true
    topK: false
    frequencyPenalty: true
    presencePenalty: true
    repetitionPenalty: false
    seed: false
    logitBias: false
  # Native document formats reviewed 2026-10-05: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses#file-input
  documentFormats:
    extensions: [.pdf]
    mediaTypes: [application/pdf]
