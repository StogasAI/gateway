# Claude Models on Google Cloud (Anthropic managed) rates usage at Anthropic's standard prices,
# and US inference at its multiplier. Reviewed 2026-11-05:
# https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/anthropic-managed
# and https://platform.claude.com/docs/en/about-claude/pricing#data-residency-pricing
deployments:
  modelId: claude-haiku-4-5
  routeIds: [google-cloud-messages]
  upstream:
    model: claude-haiku-4-5-20251001
    hosting: anthropic
  overrides:
    dataHandling:
      storageLocation: none
      retentionDays: 0
  pricing:
    input_tokens:
      per_mill_tokens: '1'
    cached_input_tokens:
      per_mill_tokens: '0.1'
    cache_write_5m_input_tokens:
      per_mill_tokens: '1.25'
    cache_write_1h_input_tokens:
      per_mill_tokens: '2'
    output_tokens:
      per_mill_tokens: '5'
